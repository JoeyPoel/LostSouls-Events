<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&amp;display=swap');
      .glow-txt {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 900;
        fill: #FFFFFF;
        text-anchor: middle;
      }
    </style>
    <radialGradient id="ambience" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0044FF" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#00E5FF" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#0044FF" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#000000" rx="16"/>
  <circle cx="50" cy="50" r="46" fill="url(#ambience)"/>
  <text x="50" y="43" class="glow-txt" font-size="22" letter-spacing="1.8" filter="url(#laserGlow)">LØST</text>
  <text x="50" y="71" class="glow-txt" font-size="22" letter-spacing="1.8" filter="url(#laserGlow)">SØULS</text>
</svg>
